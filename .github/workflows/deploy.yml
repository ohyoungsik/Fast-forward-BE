name: Deploy Backend

# main 브랜치에 push될 때 자동 배포 실행
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # ── 환경변수 ──────────────────────────────────────────────────────────────
    # Bastion(점프 서버) 접속 정보
    # Private 네트워크에 위치한 FastAPI 서버는 Bastion을 경유해서만 접근 가능
    env:
      BASTION_HOST: ${{ secrets.BASTION_HOST }}
      BASTION_USER: ${{ secrets.BASTION_USER }}
      BASTION_KEY:  ${{ secrets.BASTION_KEY }}

      FASTAPI_PRIVATE_IP: ${{ secrets.FASTAPI_PRIVATE_IP }}
      FASTAPI_USER:       ${{ secrets.FASTAPI_USER }}

      ENV_PROD: ${{ secrets.ENV_PROD }}   # 운영 환경변수 전체 (.env 내용)

      APP_DIR: /var/www/fastapi_app       # FastAPI 서버의 앱 배포 경로

    steps:

      # ── Step 1. 소스 코드 체크아웃 ──────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── Step 2. SSH 키 파일 설정 ─────────────────────────────────────────────
      # GitHub Secret에 저장된 PEM 키를 Runner의 ~/.ssh 에 저장
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$BASTION_KEY" > ~/.ssh/bastion_key.pem
          chmod 600 ~/.ssh/bastion_key.pem

      # ── Step 3. 운영 환경변수 파일 생성 ─────────────────────────────────────
      # Secret에 저장된 ENV_PROD 내용을 /tmp/.env 로 저장 (서버 전송용)
      - name: Create env file
        run: |
          echo "$ENV_PROD" > /tmp/.env

      # ── Step 4. Bastion 서버 SSH 연결 확인 ──────────────────────────────────
      # 이후 단계 실패를 방지하기 위해 Bastion 접속 가능 여부를 먼저 검증
      - name: Test SSH connection to Bastion
        run: |
          ssh -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            $BASTION_USER@$BASTION_HOST \
            "echo 'Bastion connected successfully'"

      # ── Step 5. 백엔드 소스 압축 ────────────────────────────────────────────
      # 불필요한 파일(.git, venv, __pycache__ 등)을 제외하고 tar.gz 로 패키징
      - name: Package backend source
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='.env' \
            -czf /tmp/backend.tar.gz .

      # ── Step 6. Bastion 서버로 소스 업로드 ──────────────────────────────────
      - name: Upload backend package to Bastion
        run: |
          scp -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            /tmp/backend.tar.gz \
            $BASTION_USER@$BASTION_HOST:/tmp/backend.tar.gz

      # ── Step 7. Bastion 서버로 환경변수 파일 업로드 ──────────────────────────
      - name: Upload env file to Bastion
        run: |
          scp -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            /tmp/.env \
            $BASTION_USER@$BASTION_HOST:/tmp/.env

      # ── Step 8. Bastion → Private FastAPI 서버로 파일 전달 ──────────────────
      # SSH Agent Forwarding(-A)을 사용해 Bastion에서 Private 서버로 SCP 전송
      - name: Upload files from Bastion to FastAPI server
        run: |
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/bastion_key.pem

          ssh -A -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            $BASTION_USER@$BASTION_HOST \
            "scp \
              -o StrictHostKeyChecking=no \
              /tmp/backend.tar.gz \
              /tmp/.env \
              $FASTAPI_USER@$FASTAPI_PRIVATE_IP:/tmp/"

      # ── Step 9. FastAPI 서버 배포 ────────────────────────────────────────────
      # Bastion을 경유해 Private FastAPI 서버에 접속 후 전체 배포 절차 실행
      - name: Deploy on FastAPI server
        run: |
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/bastion_key.pem

          ssh -A -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            $BASTION_USER@$BASTION_HOST \
            "ssh \
              -o StrictHostKeyChecking=no \
              $FASTAPI_USER@$FASTAPI_PRIVATE_IP \
              '
              set -e

              echo \"===== DEPLOY START =====\"

              # 앱 디렉토리 생성 (없을 경우)
              sudo mkdir -p $APP_DIR

              echo \"===== EXTRACT FILES =====\"
              sudo tar -xzf /tmp/backend.tar.gz -C $APP_DIR

              echo \"===== MOVE ENV =====\"
              sudo mv /tmp/.env $APP_DIR/.env

              echo \"===== CHECK ENV FILE =====\"
              if [ ! -f \"$APP_DIR/.env\" ]; then
                echo \"ERROR: $APP_DIR/.env file does not exist\"
                exit 1
              fi

              # 주요 환경변수 값 확인 (배포 로그에서 설정 검증용)
              sudo grep -E \"PROMETHEUS_URL|PROMETHEUS_SERVER_IP|DB_HOST|DB_NAME|COLLECT_INTERVAL\" $APP_DIR/.env

              echo \"===== INSTALL PACKAGE =====\"
              sudo apt update
              sudo apt install -y \
                python3-venv \
                python3-pip \
                python3.12-venv \
                postgresql-client

              echo \"===== CREATE VENV =====\"
              cd $APP_DIR
              sudo rm -rf venv
              sudo python3 -m venv venv

              echo \"===== INSTALL REQUIREMENTS =====\"
              sudo $APP_DIR/venv/bin/pip install --upgrade pip
              sudo $APP_DIR/venv/bin/pip install -r requirements.txt

              echo \"===== DB INIT =====\"
              # .env에서 DB_URL을 읽어 init.sql 실행 (테이블이 없을 경우에만 적용됨)
              DB_URL=\$(grep \"^DB_URL=\" $APP_DIR/.env | cut -d= -f2-)
              if [ -n \"\$DB_URL\" ] && [ -f \"$APP_DIR/init.sql\" ]; then
                psql \"\$DB_URL\" -f $APP_DIR/init.sql
              else
                echo \"DB_URL or init.sql not found. Skip DB INIT.\"
              fi

              echo \"===== CHANGE OWNER =====\"
              # www-data(gunicorn 실행 유저)가 앱 디렉토리를 읽을 수 있도록 소유권 변경
              sudo chown -R www-data:www-data $APP_DIR
              sudo chmod 600 $APP_DIR/.env

              echo \"===== CREATE FASTAPI SERVICE =====\"
              # gunicorn access/error 로그 저장 디렉토리 생성
              sudo mkdir -p /var/log/fastapi
              sudo chown www-data:www-data /var/log/fastapi

              # 레포에 포함된 서비스 파일을 systemd 경로로 복사
              # (heredoc 방식은 YAML 들여쓰기로 인해 종료 마커가 인식되지 않는 문제가 있어 분리)
              sudo cp $APP_DIR/deploy/fastapi.service /etc/systemd/system/fastapi.service

              echo \"===== SYSTEMD RELOAD =====\"
              sudo systemctl daemon-reload

              echo \"===== ENABLE FASTAPI =====\"
              sudo systemctl enable fastapi.service

              echo \"===== RESTART FASTAPI =====\"
              sudo systemctl restart fastapi.service

              sleep 5

              echo \"===== CHECK FASTAPI ACTIVE =====\"
              sudo systemctl is-active --quiet fastapi.service

              # ── 로그 및 상태 확인 (set -e에 의한 조기 종료 방지를 위해 || true 적용) ──

              echo \"===== PROCESS CHECK =====\"
              ps -ef | grep gunicorn | grep -v grep || true

              echo \"===== FASTAPI STATUS =====\"
              sudo systemctl status fastapi.service --no-pager || true

              echo \"===== FASTAPI LOG =====\"
              sudo journalctl -u fastapi.service -n 100 --no-pager || true

              echo \"===== GUNICORN ERROR LOG =====\"
              sudo tail -n 100 /var/log/fastapi/error.log 2>/dev/null || echo 'No error log yet'

              echo \"===== GUNICORN ACCESS LOG =====\"
              sudo tail -n 50 /var/log/fastapi/access.log 2>/dev/null || echo 'No access log yet'

              echo \"===== PORT CHECK =====\"
              ss -tlnp | grep 8000 || echo 'WARNING: Port 8000 NOT listening'

              echo \"===== HEALTH CHECK =====\"

              echo \"현재 서버:\"
              hostname
              pwd

              echo \"8000 포트 확인:\"
              sudo ss -lntp | grep 8000 || true

              echo \"FastAPI 상태:\"
              sudo systemctl status fastapi --no-pager || true

              echo \"FastAPI 최근 로그:\"
              sudo journalctl -u fastapi -n 80 --no-pager || true

              echo \"Health check:\"
              curl -v http://127.0.0.1:8000/api/v1/health

              curl -f http://127.0.0.1:8000/api/v1/health \
                && echo 'HEALTH CHECK PASSED' \
                || { echo 'HEALTH CHECK FAILED'; exit 1; }

              echo \"===== DEPLOY END =====\"
              '"
