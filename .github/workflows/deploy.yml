name: Deploy Backend

# main 브랜치에 push될 때 자동 배포 실행 !
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # ── 환경변수 ─────────────────────────────────────────────────────────────
    # Bastion(점프 서버) 접속 정보
    # Private 네트워크의 FastAPI 서버는 Bastion을 경유해야만 접근 가능
    env:
      BASTION_HOST: ${{ inputs.bastion_host || secrets.BASTION_HOST }}
      BASTION_USER: ${{ secrets.BASTION_USER }}
      BASTION_KEY:  ${{ secrets.BASTION_KEY }}

      FASTAPI_PRIVATE_IP: ${{ secrets.FASTAPI_PRIVATE_IP }}  # 172.16.20.20
      FASTAPI_USER:       ${{ secrets.FASTAPI_USER }}

      ENV_PROD: ${{ secrets.ENV_PROD }}        # 운영 환경변수 전체 (.env 내용)
      APP_DIR: /var/www/fastapi_app            # FastAPI 서버의 앱 배포 경로

    steps:

      # ── Step 1. 소스 코드 체크아웃 ─────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── Step 2. SSH 키 파일 설정 ────────────────────────────────────────────
      # GitHub Secret의 PEM 키를 Runner ~/.ssh 에 저장
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$BASTION_KEY" > ~/.ssh/bastion_key.pem
          chmod 600 ~/.ssh/bastion_key.pem

      # ── Step 3. 운영 환경변수 파일 생성 ────────────────────────────────────
      # Secret의 ENV_PROD 내용을 /tmp/.env 로 저장 (서버 전송용)
      - name: Create env file
        run: |
          echo "$ENV_PROD" > /tmp/.env

      # ── Step 4. Bastion 서버 SSH 연결 확인 ─────────────────────────────────
      # 이후 단계 실패 방지를 위해 Bastion 접속 가능 여부를 먼저 검증
      - name: Test SSH connection to Bastion
        run: |
          ssh -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            $BASTION_USER@$BASTION_HOST \
            "echo 'Bastion connected successfully'"

      # ── Step 5. 백엔드 소스 압축 ────────────────────────────────────────────
      # venv는 서버에서 직접 생성해야 하므로 반드시 제외
      # (runner에서 만든 venv를 복사하면 shebang 경로가 깨져 203/EXEC 오류 발생)
      - name: Package backend source
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='.env' \
            -czf /tmp/backend.tar.gz .

      # ── Step 6. Bastion 서버로 소스 업로드 ─────────────────────────────────
      - name: Upload backend package to Bastion
        run: |
          scp -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            /tmp/backend.tar.gz \
            $BASTION_USER@$BASTION_HOST:/tmp/backend.tar.gz

      # ── Step 7. Bastion 서버로 환경변수 파일 업로드 ─────────────────────────
      - name: Upload env file to Bastion
        run: |
          scp -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            /tmp/.env \
            $BASTION_USER@$BASTION_HOST:/tmp/.env

      # ── Step 8. Bastion → Private FastAPI 서버로 파일 전달 ─────────────────
      # SSH Agent Forwarding(-A)으로 Bastion에서 Private 서버로 SCP 전송
      - name: Upload files from Bastion to FastAPI server
        run: |
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/bastion_key.pem

          ssh -A -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            $BASTION_USER@$BASTION_HOST \
            "scp \
              -o StrictHostKeyChecking=no \
              /tmp/backend.tar.gz \
              /tmp/.env \
              $FASTAPI_USER@$FASTAPI_PRIVATE_IP:/tmp/"

      # ── Step 9. FastAPI 서버 배포 ────────────────────────────────────────────
      # heredoc/따옴표 중첩 없이 단순한 SSH 명령으로 구성
      # → tar 추출 후 scripts/server_setup.sh 실행 (모든 배포 로직은 스크립트 파일로 분리)
      - name: Deploy on FastAPI server
        run: |
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/bastion_key.pem

          ssh -A -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            $BASTION_USER@$BASTION_HOST \
            "ssh -o StrictHostKeyChecking=no $FASTAPI_USER@$FASTAPI_PRIVATE_IP \
              'sudo mkdir -p /var/www/fastapi_app && sudo tar -xzf /tmp/backend.tar.gz -C /var/www/fastapi_app && sudo bash /var/www/fastapi_app/scripts/server_setup.sh'"
