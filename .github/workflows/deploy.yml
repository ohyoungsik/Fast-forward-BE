name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      BASTION_HOST: ${{ secrets.BASTION_HOST }}
      BASTION_USER: ${{ secrets.BASTION_USER }}
      FASTAPI_PRIVATE_IP: ${{ secrets.FASTAPI_PRIVATE_IP }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BASTION_KEY }}" > ~/.ssh/bastion_key.pem
          chmod 600 ~/.ssh/bastion_key.pem

      - name: Test SSH connection to Bastion
        run: |
          ssh -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            $BASTION_USER@$BASTION_HOST \
            "echo 'Bastion connected successfully'"

      - name: Deploy Backend to fastapi-be-server
        run: |
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/bastion_key.pem

          ssh -A -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            $BASTION_USER@$BASTION_HOST \
            "ssh -o StrictHostKeyChecking=no ubuntu@$FASTAPI_PRIVATE_IP \
              'set -e &&
               cd ~/backend &&
               git pull origin main &&
               cp .env.prod .env &&
               source venv/bin/activate &&
               pip install -r requirements.txt &&
               sudo systemctl restart fastapi'"