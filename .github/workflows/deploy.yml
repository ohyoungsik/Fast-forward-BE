name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      BASTION_HOST: ${{ secrets.BASTION_HOST }}
      BASTION_USER: ${{ secrets.BASTION_USER }}
      FASTAPI_PRIVATE_IP: ${{ secrets.FASTAPI_PRIVATE_IP }}
      FASTAPI_USER: ubuntu
      APP_DIR: /home/ubuntu/backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BASTION_KEY }}" > ~/.ssh/bastion_key.pem
          chmod 600 ~/.ssh/bastion_key.pem

      - name: Test SSH connection to Bastion
        run: |
          ssh -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            $BASTION_USER@$BASTION_HOST \
            "echo 'Bastion connected successfully'"

      - name: Package backend source
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='.env' \
            -czf backend.tar.gz .

      - name: Upload backend to private server
        run: |
          scp -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o ProxyJump=$BASTION_USER@$BASTION_HOST \
            backend.tar.gz \
            $FASTAPI_USER@$FASTAPI_PRIVATE_IP:/tmp/backend.tar.gz

      - name: Deploy on private server
        run: |
          ssh -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o ProxyJump=$BASTION_USER@$BASTION_HOST \
            $FASTAPI_USER@$FASTAPI_PRIVATE_IP \
            "set -e &&
             mkdir -p $APP_DIR &&
             tar -xzf /tmp/backend.tar.gz -C $APP_DIR &&
             cd $APP_DIR &&
             cp .env.prod .env &&
             python3 -m venv venv &&
             source venv/bin/activate &&
             pip install --upgrade pip &&
             pip install -r requirements.txt &&
             sudo systemctl restart fastapi"