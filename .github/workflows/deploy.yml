name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      BASTION_HOST: ${{ secrets.BASTION_HOST }}
      BASTION_USER: ${{ secrets.BASTION_USER }}
      BASTION_KEY: ${{ secrets.BASTION_KEY }}

      FASTAPI_PRIVATE_IP: ${{ secrets.FASTAPI_PRIVATE_IP }}
      FASTAPI_USER: ${{ secrets.FASTAPI_USER }}

      ENV_PROD: ${{ secrets.ENV_PROD }}

      APP_DIR: /var/www/fastapi_app

    steps:
      # 1. GitHub 소스 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. SSH 키 설정
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh

          echo "$BASTION_KEY" > ~/.ssh/bastion_key.pem

          chmod 600 ~/.ssh/bastion_key.pem

      # 3. .env 파일 생성
      - name: Create env file
        run: |
          echo "$ENV_PROD" > /tmp/.env

      # 4. Bastion 접속 테스트
      - name: Test SSH connection to Bastion
        run: |
          ssh -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            $BASTION_USER@$BASTION_HOST \
            "echo 'Bastion connected successfully'"

      # 5. backend 압축
      - name: Package backend source
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='.env' \
            -czf /tmp/backend.tar.gz .

      # 6. Bastion 서버로 backend 업로드
      - name: Upload backend package to Bastion
        run: |
          scp -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            /tmp/backend.tar.gz \
            $BASTION_USER@$BASTION_HOST:/tmp/backend.tar.gz

      # 7. Bastion 서버로 env 업로드
      - name: Upload env file to Bastion
        run: |
          scp -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            /tmp/.env \
            $BASTION_USER@$BASTION_HOST:/tmp/.env

      # 8. Bastion → Private FastAPI 서버로 파일 전달
      - name: Upload files from Bastion to FastAPI server
        run: |
          eval $(ssh-agent -s)

          ssh-add ~/.ssh/bastion_key.pem

          ssh -A -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            $BASTION_USER@$BASTION_HOST \
            "scp \
              -o StrictHostKeyChecking=no \
              /tmp/backend.tar.gz \
              /tmp/.env \
              $FASTAPI_USER@$FASTAPI_PRIVATE_IP:/tmp/"

      # 9. FastAPI 서버 배포
      - name: Deploy on FastAPI server
        run: |
          eval $(ssh-agent -s)

          ssh-add ~/.ssh/bastion_key.pem

          ssh -A -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            $BASTION_USER@$BASTION_HOST \
            "ssh \
              -o StrictHostKeyChecking=no \
              $FASTAPI_USER@$FASTAPI_PRIVATE_IP \
              '
              set -e

              echo \"===== DEPLOY START =====\"

              sudo mkdir -p $APP_DIR

              echo \"===== EXTRACT FILES =====\"

              sudo tar -xzf /tmp/backend.tar.gz -C $APP_DIR

              echo \"===== MOVE ENV =====\"

              sudo mv /tmp/.env $APP_DIR/.env

              echo \"===== INSTALL PACKAGE =====\"

              sudo apt update

              sudo apt install -y \
                python3-venv \
                python3-pip \
                python3.12-venv \
                postgresql-client

              echo \"===== DB INIT =====\"

              DB_URL=\$(grep '^DB_URL=' $APP_DIR/.env | cut -d= -f2-)
              psql \"\$DB_URL\" -f $APP_DIR/init.sql

              echo \"===== CREATE VENV =====\"

              cd $APP_DIR

              sudo rm -rf venv

              sudo python3 -m venv venv

              echo \"===== INSTALL REQUIREMENTS =====\"

              sudo $APP_DIR/venv/bin/pip install --upgrade pip

              sudo $APP_DIR/venv/bin/pip install -r requirements.txt

              echo \"===== CHANGE OWNER =====\"

              sudo chown -R www-data:www-data $APP_DIR

              echo "===== CREATE FASTAPI SERVICE ====="

              sudo tee /etc/systemd/system/fastapi.service > /dev/null <<EOF
              [Unit]
              Description=FastAPI Backend Service
              After=network.target

              [Service]
              User=www-data
              Group=www-data
              WorkingDirectory=$APP_DIR
              EnvironmentFile=$APP_DIR/.env
              ExecStart=$APP_DIR/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
              Restart=always
              RestartSec=5

              [Install]
              WantedBy=multi-user.target
              EOF

              echo \"===== SYSTEMD RELOAD =====\"
              sudo systemctl daemon-reload

              echo \"===== ENABLE FASTAPI =====\"
              sudo systemctl enable fastapi.service

              echo \"===== RESTART FASTAPI =====\"
              sudo systemctl restart fastapi.service

              sleep 5

              echo "===== CHECK FASTAPI ACTIVE ====="
              sudo systemctl is-active --quiet fastapi.service  

              echo "===== HEALTH CHECK ====="
              curl -f http://127.0.0.1:8000/docs

              echo \"===== FASTAPI STATUS =====\"
              sudo systemctl status fastapi.service --no-pager || true

              echo \"===== FASTAPI LOG =====\"
              sudo journalctl -u fastapi.service \
                -n 50 \
                --no-pager

              echo \"===== DEPLOY END =====\"
              '"