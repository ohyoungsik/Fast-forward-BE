name: Deploy Backend

# main 브랜치에 push될 때 자동 배포 실행
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # ── 환경변수 ─────────────────────────────────────────────────────────────
    # Bastion(점프 서버) 접속 정보
    # Private 네트워크의 FastAPI 서버는 Bastion을 경유해야만 접근 가능
    env:
      BASTION_HOST: ${{ secrets.BASTION_HOST }}
      BASTION_USER: ${{ secrets.BASTION_USER }}
      BASTION_KEY:  ${{ secrets.BASTION_KEY }}

      FASTAPI_PRIVATE_IP: ${{ secrets.FASTAPI_PRIVATE_IP }}  # 172.16.20.20
      FASTAPI_USER:       ${{ secrets.FASTAPI_USER }}

      ENV_PROD: ${{ secrets.ENV_PROD }}        # 운영 환경변수 전체 (.env 내용)
      APP_DIR: /var/www/fastapi_app            # FastAPI 서버의 앱 배포 경로

    steps:

      # ── Step 1. 소스 코드 체크아웃 ─────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── Step 2. SSH 키 파일 설정 ────────────────────────────────────────────
      # GitHub Secret의 PEM 키를 Runner ~/.ssh 에 저장
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$BASTION_KEY" > ~/.ssh/bastion_key.pem
          chmod 600 ~/.ssh/bastion_key.pem

      # ── Step 3. 운영 환경변수 파일 생성 ────────────────────────────────────
      # Secret의 ENV_PROD 내용을 /tmp/.env 로 저장 (서버 전송용)
      - name: Create env file
        run: |
          echo "$ENV_PROD" > /tmp/.env

      # ── Step 4. Bastion 서버 SSH 연결 확인 ─────────────────────────────────
      # 이후 단계 실패 방지를 위해 Bastion 접속 가능 여부를 먼저 검증
      - name: Test SSH connection to Bastion
        run: |
          ssh -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            $BASTION_USER@$BASTION_HOST \
            "echo 'Bastion connected successfully'"

      # ── Step 5. 백엔드 소스 압축 ────────────────────────────────────────────
      # venv는 서버에서 직접 생성해야 하므로 반드시 제외
      # (runner에서 만든 venv를 복사하면 shebang 경로가 깨져 203/EXEC 오류 발생)
      - name: Package backend source
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='.env' \
            -czf /tmp/backend.tar.gz .

      # ── Step 6. Bastion 서버로 소스 업로드 ─────────────────────────────────
      - name: Upload backend package to Bastion
        run: |
          scp -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            /tmp/backend.tar.gz \
            $BASTION_USER@$BASTION_HOST:/tmp/backend.tar.gz

      # ── Step 7. Bastion 서버로 환경변수 파일 업로드 ─────────────────────────
      - name: Upload env file to Bastion
        run: |
          scp -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            /tmp/.env \
            $BASTION_USER@$BASTION_HOST:/tmp/.env

      # ── Step 8. Bastion → Private FastAPI 서버로 파일 전달 ─────────────────
      # SSH Agent Forwarding(-A)으로 Bastion에서 Private 서버로 SCP 전송
      - name: Upload files from Bastion to FastAPI server
        run: |
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/bastion_key.pem

          ssh -A -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            $BASTION_USER@$BASTION_HOST \
            "scp \
              -o StrictHostKeyChecking=no \
              /tmp/backend.tar.gz \
              /tmp/.env \
              $FASTAPI_USER@$FASTAPI_PRIVATE_IP:/tmp/"

      # ── Step 9. FastAPI 서버 배포 ────────────────────────────────────────────
      # bash -s <<'EOF' 방식: 스크립트를 stdin으로 전달
      # → 기존 이중 SSH + 단따옴표 중첩 방식의 따옴표 이스케이프 문제 해결
      - name: Deploy on FastAPI server
        run: |
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/bastion_key.pem

          ssh -A -i ~/.ssh/bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            $BASTION_USER@$BASTION_HOST \
            "ssh \
              -o StrictHostKeyChecking=no \
              $FASTAPI_USER@$FASTAPI_PRIVATE_IP \
              'bash -s' <<'EOF'
          set -e

          APP_DIR="/var/www/fastapi_app"

          echo "===== DEPLOY START ====="
          hostname
          whoami

          echo "===== CREATE APP DIR ====="
          sudo mkdir -p "$APP_DIR"

          echo "===== EXTRACT FILES ====="
          sudo tar -xzf /tmp/backend.tar.gz -C "$APP_DIR"

          echo "===== MOVE ENV ====="
          sudo mv /tmp/.env "$APP_DIR/.env"

          # .env 파일 존재 여부 확인
          echo "===== CHECK ENV FILE ====="
          if [ ! -f "$APP_DIR/.env" ]; then
            echo "ERROR: $APP_DIR/.env file does not exist"
            exit 1
          fi

          # 주요 환경변수 값 출력 (배포 로그에서 설정 검증용)
          sudo grep -E "PROMETHEUS_URL|PROMETHEUS_SERVER_IP|DB_HOST|DB_NAME|COLLECT_INTERVAL|DB_URL" "$APP_DIR/.env" || true

          echo "===== INSTALL SYSTEM PACKAGE ====="
          sudo apt update
          sudo apt install -y \
            python3-venv \
            python3-pip \
            python3.12-venv \
            postgresql-client

          # ── venv 생성 및 패키지 설치 ──────────────────────────────────────
          # venv가 없을 때만 새로 생성 (재배포 시 불필요한 생성 방지)
          # www-data 유저로 설치해야 shebang 경로가 서버 경로로 올바르게 설정됨
          # root로 설치하면 shebang이 /root/... 가 되어 www-data가 실행 불가
          echo "===== INSTALL PYTHON DEPENDENCIES ====="
          cd "$APP_DIR"

          if [ ! -d "venv" ]; then
            sudo python3 -m venv venv
          fi

          sudo chown -R www-data:www-data "$APP_DIR"
          sudo chmod 600 "$APP_DIR/.env"

          sudo -u www-data "$APP_DIR/venv/bin/python" -m pip install --upgrade pip

          if [ -f "$APP_DIR/requirements.txt" ]; then
            sudo -u www-data "$APP_DIR/venv/bin/pip" install -r "$APP_DIR/requirements.txt"
          else
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          # requirements.txt에 포함되어 있지만 명시적으로 재확인
          sudo -u www-data "$APP_DIR/venv/bin/pip" install gunicorn uvicorn

          # gunicorn shebang 경로 확인
          # 정상: #!/var/www/fastapi_app/venv/bin/python3
          # 비정상: #!/home/runner/... (runner 경로면 서버에서 실행 불가)
          echo "===== CHECK GUNICORN ====="
          ls -al "$APP_DIR/venv/bin/gunicorn"
          head -1 "$APP_DIR/venv/bin/gunicorn"

          echo "===== DB INIT ====="
          DB_URL=$(grep "^DB_URL=" "$APP_DIR/.env" | cut -d= -f2- || true)

          if [ -n "$DB_URL" ] && [ -f "$APP_DIR/init.sql" ]; then
            psql "$DB_URL" -f "$APP_DIR/init.sql"
          else
            echo "DB_URL or init.sql not found. Skip DB INIT."
          fi

          echo "===== CREATE FASTAPI LOG DIR ====="
          sudo mkdir -p /var/log/fastapi
          sudo chown www-data:www-data /var/log/fastapi

          # ── systemd 서비스 파일 생성 ──────────────────────────────────────
          # 주의: <<SERVICE 종료 마커가 들여쓰기 되어 있어 bash가 인식 못 할 수 있음
          # → 현재 bash -s 방식이므로 동작 여부 확인 필요
          echo "===== CREATE FASTAPI SERVICE ====="
          sudo tee /etc/systemd/system/fastapi.service > /dev/null <<SERVICE
          [Unit]
          Description=FastAPI Backend Service
          After=network.target

          [Service]
          User=www-data
          Group=www-data
          WorkingDirectory=/var/www/fastapi_app
          EnvironmentFile=/var/www/fastapi_app/.env
          Environment="PATH=/var/www/fastapi_app/venv/bin"
          ExecStart=/var/www/fastapi_app/venv/bin/gunicorn \\
              -w 2 \\
              -k uvicorn.workers.UvicornWorker \\
              -b 0.0.0.0:8000 \\
              --access-logfile /var/log/fastapi/access.log \\
              --error-logfile /var/log/fastapi/error.log \\
              --log-level info \\
              main:app
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          echo "===== SYSTEMD RELOAD ====="
          sudo systemctl daemon-reload

          echo "===== ENABLE FASTAPI ====="
          sudo systemctl enable fastapi.service

          echo "===== RESTART FASTAPI ====="
          sudo systemctl restart fastapi.service

          sleep 5

          # ── 배포 후 상태 확인 (|| true 로 set -e 조기 종료 방지) ───────────
          echo "===== FASTAPI STATUS ====="
          sudo systemctl status fastapi.service --no-pager || true

          echo "===== FASTAPI JOURNAL LOG ====="
          sudo journalctl -u fastapi.service -n 100 --no-pager || true

          echo "===== GUNICORN ERROR LOG ====="
          sudo tail -n 100 /var/log/fastapi/error.log 2>/dev/null || echo "No error log yet"

          echo "===== PROCESS CHECK ====="
          ps -ef | grep gunicorn | grep -v grep || true

          echo "===== PORT CHECK ====="
          sudo ss -lntp | grep 8000 || true

          # curl -v 로 응답 상세 확인 후, -f 로 실제 성공/실패 판정
          echo "===== HEALTH CHECK ====="
          curl -v http://127.0.0.1:8000/api/v1/health || true

          curl -f http://127.0.0.1:8000/api/v1/health \
            && echo "HEALTH CHECK PASSED" \
            || { echo "HEALTH CHECK FAILED"; sudo journalctl -u fastapi.service -n 150 --no-pager; exit 1; }

          echo "===== DEPLOY END ====="
          EOF"
